<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flix">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flix – Xem phim online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c14;--s1:#12151f;--s2:#1a1e2b;--line:rgba(255,255,255,.08);--text:#eef0f6;--mute:#8b91a5;--a:#7c5cff;--a2:#22d3ee;--r:16px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
header{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:14px;padding:12px max(16px,calc((100% - 1280px)/2 + 16px));background:linear-gradient(#0a0c14e6,#0a0c1400);backdrop-filter:blur(2px)}
header.solid{background:rgba(10,12,20,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-style:normal;font-size:13px}
.search{flex:1;max-width:460px;margin-left:auto;position:relative}
.search input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:99px;padding:10px 16px 10px 42px;outline:0;transition:.2s}
.search input:focus{background:rgba(255,255,255,.12);border-color:var(--a)}
.search svg{position:absolute;left:15px;top:50%;translate:0 -50%;width:17px;opacity:.6}
.seg{display:flex;padding:3px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:99px}
.seg button{background:none;border:0;padding:7px 14px;border-radius:99px;cursor:pointer;color:var(--mute);font-weight:500;font-size:13px}
.seg button.on{background:#fff;color:#0a0c14;font-weight:600}
.hero{position:relative;min-height:min(78vh,620px);display:flex;align-items:flex-end;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 18%;background-repeat:no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 2%,#0a0c14b3 28%,transparent 62%),linear-gradient(90deg,#0a0c14a6 0,#0a0c1440 45%,transparent 75%)}
.hero .in{position:relative;z-index:1;width:100%;max-width:1280px;margin:0 auto;padding:110px 16px 56px;display:flex;gap:36px;align-items:flex-end}
.hero img{width:230px;aspect-ratio:2/3;object-fit:cover;border-radius:var(--r);box-shadow:0 30px 60px #0009;flex:none}
.hero h1{font-size:clamp(30px,5vw,56px);line-height:1.05;letter-spacing:-1.5px;font-weight:800;max-width:14ch}
.hero p{color:#c4c8d6;margin:10px 0 22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:12px 26px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.1);border:1px solid var(--line);transition:.2s}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.pri{background:linear-gradient(135deg,var(--a),#5a7bff);border-color:transparent;box-shadow:0 8px 28px #7c5cff55}
.btn.pri:hover{filter:brightness(1.1)}
main{max-width:1280px;margin:0 auto;padding:0 16px 60px}
.top{height:84px}
nav{display:flex;gap:8px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none;position:relative;z-index:2}
nav button{white-space:nowrap;background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:8px 18px;cursor:pointer;color:var(--mute);font-weight:500;transition:.2s}
nav button:hover{color:var(--text)}
nav button.on{background:#fff;color:#0a0c14;border-color:#fff;font-weight:600}
h2{font-size:22px;font-weight:700;letter-spacing:-.4px;margin:26px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:22px 16px}
.card{display:block;min-width:0}
.poster{position:relative;aspect-ratio:2/3;background:var(--s1);border-radius:var(--r);overflow:hidden;transition:.3s cubic-bezier(.2,.8,.2,1)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000c,transparent 45%);opacity:0;transition:.25s}
.play{position:absolute;z-index:1;left:50%;top:50%;translate:-50% -50%;scale:.7;opacity:0;width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:.25s}
.play:before{content:"";border-left:15px solid #0a0c14;border-block:9px solid transparent;margin-left:4px}
.card:hover .poster{translate:0 -6px;box-shadow:0 18px 40px #0008,0 0 0 1px #fff3}
.card:hover .poster:after,.card:hover .play{opacity:1}
.card:hover .play{scale:1}
.tag{position:absolute;z-index:1;left:8px;top:8px;background:rgba(10,12,20,.72);backdrop-filter:blur(8px);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600}
.card .t{margin-top:10px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .o{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .poster{animation:sh 1.3s infinite;background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%);background-size:300% 100%}
.sk i{display:block;height:12px;border-radius:6px;background:var(--s1);margin-top:10px;width:80%}
@keyframes sh{to{background-position:-150% 0}}
.pager{display:flex;gap:12px;justify-content:center;align-items:center;margin:36px 0;color:var(--mute)}
.pager button:disabled{opacity:.35;pointer-events:none}
.msg{padding:70px 0;text-align:center;color:var(--mute)}
.dv{position:relative}
.dv .bg{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.3);opacity:.35;z-index:-1}
.player{aspect-ratio:16/9;background:#000;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px #000a,0 0 0 1px var(--line)}
.player iframe,.player video{width:100%;height:100%;border:0;display:block;background:#000}
.panel{background:rgba(18,21,31,.7);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row+.row{margin-top:14px}
.row .lbl{color:var(--mute);font-size:13px;min-width:66px}
.chip{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px;transition:.15s}
.chip:hover{border-color:#fff4}
.chip.on{background:linear-gradient(135deg,var(--a),#5a7bff);border-color:transparent;font-weight:600}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;max-height:240px;overflow:auto;margin-top:14px;padding-right:4px}
.eps .chip{text-align:center;padding:8px 4px}
.info{display:grid;grid-template-columns:200px 1fr;gap:28px;margin-top:30px}
.info img{width:100%;border-radius:var(--r);box-shadow:0 20px 50px #0008}
.info h1{font-size:clamp(24px,4vw,38px);letter-spacing:-1px;line-height:1.1}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.meta span{background:var(--s2);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:500}
.meta span:first-child{background:#fff;color:#0a0c14;font-weight:700}
.info dl{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;color:var(--mute);margin:16px 0}
.info dd{color:var(--text)}
.desc{color:#c4c8d6;max-width:68ch}
body{padding-bottom:84px}
.seg{margin-left:auto}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:rgba(255,255,255,.16)}
.ib svg{width:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.sov{position:fixed;inset:0 0 auto;z-index:30;display:flex;gap:10px;align-items:center;padding:12px max(16px,calc((100% - 1280px)/2 + 16px));background:rgba(10,12,20,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);translate:0 -110%;transition:.25s}
.sov.open{translate:0 0}
.sov input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:99px;padding:11px 18px;outline:0}
.sov input:focus{border-color:var(--a)}
.sov .btn{padding:11px 22px}
.bn{position:fixed;inset:auto 0 0;z-index:25;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(10,12,20,.88);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.bn a{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mute);padding:5px 0;border-radius:12px;transition:.15s}
.bn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bn a.on{color:#fff}.bn a.on svg{stroke:var(--a2)}
.me{display:flex;gap:16px;align-items:center;margin:8px 0 18px}
.av{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-size:30px}
.me h1{font-size:26px;letter-spacing:-.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.sub{color:var(--mute);font-size:13px}
.inp{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:0;min-width:0}
.inp:focus{border-color:var(--a)}
.fld{display:grid;gap:10px;margin-top:14px;max-width:380px}
.err{color:#ff7a8a;font-size:13px;min-height:18px}
.emo{font-size:18px;padding:4px 10px}
.flt{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 2px;position:relative;z-index:2}
.flt select{background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:8px 14px;color:var(--text);outline:0;cursor:pointer}
.flt option{background:#12151f}
.panel .btn{padding:9px 20px}
.pw{position:relative;width:100%;height:100%;background:#000;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;color:#fff}
.pw[hidden]{display:none}
.pv,.pv video,.pv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.pv video{object-fit:contain}
.pw:fullscreen{border-radius:0}
.pw.mini{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(300px,62vw);height:auto;aspect-ratio:16/9;z-index:28;border-radius:14px;box-shadow:0 16px 40px #000c,0 0 0 1px #fff3}
.ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;opacity:0;transition:opacity .25s;background:linear-gradient(#000a,#0000 30%,#0000 55%,#000c)}
.ctl.on,.pw.mini .ctl{opacity:1}
.ctl:not(.on) button,.ctl:not(.on) input{pointer-events:none}
.pw.mini .ctl button{pointer-events:auto}
.ctl.lite{opacity:1;background:none;pointer-events:none}
.ctl.lite button{pointer-events:auto}
.ctop{display:flex;justify-content:space-between;padding:10px}
.cmid{display:flex;gap:30px;justify-content:center;align-items:center}
.cbot{padding:0 14px 8px}
.crow{display:flex;align-items:center;gap:8px}
.crow .sp{flex:1}
.tm{font-size:13px;font-variant-numeric:tabular-nums}
.cb{background:rgba(0,0,0,.5);backdrop-filter:blur(6px);border:0;color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;padding:0}
.cb:hover{background:rgba(255,255,255,.25)}
.cb.big{width:64px;height:64px}.cb.big svg{width:30px;height:30px}
.cb.sk{width:48px;height:48px}.cb.sk svg{width:28px;height:28px}
.cb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cb svg.f{fill:currentColor;stroke:none}
.seek{width:100%;accent-color:var(--a2);height:18px;margin:0;cursor:pointer}
.mb{display:none;gap:8px}
.pw.mini .mb{display:flex}
.pw.mini .nm,.pw.mini .sk,.pw.mini .cbot{display:none}
.pw.mini .cb{width:30px;height:30px}.pw.mini .cb svg{width:15px;height:15px}
.pw.mini .cb.big{width:44px;height:44px}.pw.mini .cb.big svg{width:22px;height:22px}
.pw.mini .ctop{padding:6px}
.ph{display:grid;place-items:center;height:100%;background:#000}
.fl{position:absolute;top:50%;translate:0 -50%;padding:8px 16px;border-radius:99px;background:#000a;font-weight:600;pointer-events:none;animation:fo .7s forwards}
.fl.l{left:12%}.fl.r{right:12%}
@keyframes fo{to{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));translate:-50% 0;max-width:88vw;background:#000e;border:1px solid var(--line);border-radius:12px;padding:10px 16px;z-index:40;font-size:14px;text-align:center}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{display:flex;gap:8px;align-items:center;justify-content:center;padding:18px 8px;border-radius:14px;background:linear-gradient(135deg,var(--s2),var(--s1));border:1px solid var(--line);font-weight:600;text-align:center;transition:.2s}
.tile:hover{border-color:var(--a);translate:0 -2px}
.sec{margin-top:4px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.more{color:var(--a2);font-size:14px;font-weight:500;white-space:nowrap}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin-inline:-16px;padding:4px 16px 14px}
.rail::-webkit-scrollbar,.gch::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 128px;width:128px;min-width:0;scroll-snap-align:start}
.gch{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
.gch .chip{white-space:nowrap;border-radius:99px}
header,.sov{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.top{height:calc(84px + env(safe-area-inset-top,0px))}
.pw.full{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:35;border-radius:0}
.pw.full .mb{display:flex}
.pw.full .ctop{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.pw.full .cbot{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
@media(max-width:700px){.rail .card{flex-basis:104px;width:104px}.card .t{font-size:13px}.card .o{font-size:11.5px}.rail{gap:10px}}
@media(max-width:700px){
 header{flex-wrap:wrap;gap:10px}.search{order:3;flex-basis:100%;max-width:none;margin:0}.seg{margin-left:auto}
 .hero .in{flex-direction:column;align-items:flex-start;padding-bottom:36px}.hero img{display:none}
 .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:18px 10px}
 .info{grid-template-columns:110px 1fr;gap:16px}.hero{min-height:480px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Chế độ TV ===== */

body.tv #app{padding-left:140px}
body.tv header{left:140px;padding:20px 56px 14px}
body.tv .logo{font-size:30px}body.tv .logo i{width:40px;height:40px;font-size:18px}

body.tv .chip:focus,body.tv .btn:focus,body.tv .tile:focus,body.tv .more:focus,body.tv .cb:focus,body.tv .ib:focus,body.tv .seg button:focus,body.tv .logo:focus,body.tv .inp:focus{outline:4px solid #fff;outline-offset:3px;scale:1.06}
body.tv .chip:focus,body.tv .btn:focus,body.tv .tile:focus{background:#fff;color:#0a0c14}

body.tv #pw:focus{outline:4px solid #fff;outline-offset:-4px}
</style>
</head>
<body>
<header id="hd">
  <a class="logo" href="#/"><i>▶</i>Flix</a>
  <button class="ib" id="sb" aria-label="Tìm kiếm"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <div class="seg" id="srcSeg"><button data-s="kk">KKPhim</button><button data-s="ng">NguonC</button></div>
</header>
<form class="sov" id="sf"><input id="q" placeholder="Nhập tên phim..." autocomplete="off" enterkeyhint="search"><button class="btn pri">Tìm</button><button type="button" class="ib" id="sx" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></form>
<nav class="bn" id="bn">
<a href="#/" data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Trang chủ</a>

const FLAG={"han-quoc":"🇰🇷","trung-quoc":"🇨🇳","au-my":"🇺🇸","nhat-ban":"🇯🇵","thai-lan":"🇹🇭","viet-nam":"🇻🇳","dai-loan":"🇹🇼","hong-kong":"🇭🇰","an-do":"🇮🇳"};
function kham(){syncSeg();tab("kham");
 const t=(k,a,fl)=>`<div class="tg">${a.map(([v,n])=>`<a class="tile" href="#/loc/${k}/${v}">${fl&&FLAG[v]?FLAG[v]+" ":""}${n}</a>`).join("")}</div>`;
 $("#app").innerHTML=`<main><div class="top"></div><h2>Thể loại</h2>${t("g",GEN)}<h2>Quốc gia</h2>${t("c",COU,1)}<h2>Năm phát hành</h2>${t("y",YRS)}</main>`}
function route(){
 {const sl=$("#slot");if(sl&&sl.contains(pw)&&!pw.hidden)(V&&!V.paused)?toMini():closeP()}
 scrollTo(0,0);document.title="Flix – Xem phim online";$("#sf").classList.remove("open");
 const p=location.hash.replace(/^#\/?/,"").split("/");
 S={cat:"moi",page:1,q:"",g:"",c:"",y:""};
 if(p[0]==="phim"&&/^(kk|ng)$/.test(p[1])&&p[2]){tab(null);return detail(p[1],decodeURIComponent(p.slice(2).join("/")))}
 if(p[0]==="ca-nhan")return profile();
 if(p[0]==="the-loai")return kham();
 if(p[0]==="moi"){tab("home");return list()}
 if(p[0]==="loc"&&["g","c","y"].includes(p[1])){S[p[1]]=decodeURIComponent(p[2]||"");tab("kham");return list()}
 if(p[0]==="tim"){S.q=decodeURIComponent(p[1]||"");tab(null);return list()}
 if(CATS.some(c=>c[0]===p[0])&&p[0]!=="moi"){S.cat=p[0];tab(p[0]);return list()}
 tab("home");home();
}
$("#srcSeg").onclick=e=>{const s=e.target.dataset?.s;if(!s)return;src=s;safe(()=>localStorage.setItem("src",s));inDetail()?(location.hash="#/"):route()};
$("#sb").onclick=()=>{$("#sf").classList.add("open");$("#q").focus()};
$("#sx").onclick=()=>$("#sf").classList.remove("open");
$("#sf").onsubmit=e=>{e.preventDefault();const q=$("#q").value.trim();if(!q)return;const t="#/tim/"+encodeURIComponent(q);location.hash===t?route():(location.hash=t);$("#q").blur()};
addEventListener("keydown",e=>{if(e.key==="Escape")$("#sf").classList.remove("open")});
addEventListener("scroll",()=>$("#hd").classList.toggle("solid",scrollY>40),{passive:true});
addEventListener("syncdone",()=>{if(/^#\/ca-nhan/.test(location.hash))profile()});
if(window.Sync&&Sync.on()&&me)Sync.flush();
addEventListener("hashchange",route);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
route();
