name: Build Android TV APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Chuan bi file web (giao dien TV)
        run: |
          mkdir www
          cp tv.html www/index.html
          cp sync.js icon-192.png icon-512.png www/

      - name: Tao du an Android (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7
          echo '{"appId":"com.flix.tv","appName":"Flix TV","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android

      - name: Cau hinh Android TV (Leanback, banner, man hinh ngang)
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          print(s)

          # 1) uses-feature leanback (khong bat buoc)
          if "android.software.leanback" not in s:
              s = s.replace("<application",
                '<uses-feature android:name="android.software.leanback" android:required="false" />\n'
                '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n'
                '    <application', 1)

          # 2) them LEANBACK_LAUNCHER canh LAUNCHER
          if "LEANBACK_LAUNCHER" not in s:
              s = re.sub(
                r'(<category\s+android:name="android\.intent\.category\.LAUNCHER"\s*/>)',
                r'\1\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />',
                s, count=1)

          # 3) banner + man hinh ngang cho activity
          if "android:banner" not in s:
              s = re.sub(r'<activity\b', '<activity android:banner="@drawable/banner"', s, count=1)
          if "screenOrientation" not in s:
              s = re.sub(r'<activity\b', '<activity android:screenOrientation="landscape"', s, count=1)

          assert "LEANBACK_LAUNCHER" in s, "Khong chen duoc LEANBACK_LAUNCHER"
          assert "android:banner" in s, "Khong chen duoc banner"
          open(p, "w", encoding="utf-8").write(s)
          PY
          mkdir -p android/app/src/main/res/drawable assets
          convert icon-512.png -resize 150x150 -background '#0a0c14' -gravity center -extent 320x180 android/app/src/main/res/drawable/banner.png
          convert icon-512.png -resize 1024x1024 assets/icon-only.png || true
          npx @capacitor/assets generate --android --iconBackgroundColor '#0a0c14' || true
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Flix-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
