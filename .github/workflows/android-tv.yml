name: Build Android TV APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Chuan bi file web (giao dien TV)
        run: |
          mkdir www
          cp tv.html www/index.html
          cp sync.js icon-192.png icon-512.png www/

      - name: Tao du an Android (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7
          echo '{"appId":"com.flix.tv","appName":"Flix TV","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android

      - name: Cau hinh Android TV (Leanback, banner, man hinh ngang)
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          print(open(p, encoding="utf-8").read())
          manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:banner="@drawable/banner"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|navigation"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:banner="@drawable/banner"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"></meta-data>
                  </provider>
              </application>

              <uses-permission android:name="android.permission.INTERNET" />
          </manifest>
          """
          open(p, "w", encoding="utf-8").write(manifest)
          PY
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/drawable assets
          convert icon-512.png -resize 150x150 -background '#0a0c14' -gravity center -extent 320x180 android/app/src/main/res/drawable/banner.png
          convert icon-512.png -resize 1024x1024 assets/icon-only.png || true
          npx @capacitor/assets generate --android --iconBackgroundColor '#0a0c14' || true
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Flix-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
